name: Windows build and preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Packaging regression tests
        run: python -m unittest discover -s Tests -p test_release.py
      - name: Verified dependencies
        run: ./Setup.ps1
      - name: Compile with installed Microsoft toolchain
        run: ./Build.ps1 -Toolchain Installed -NoPromote -SkipTests
      - name: CTest, persistence, streaming, UI and performance probes
        run: ./Test.ps1 -Performance
      - name: Portable clean-install regression
        run: |
          $env:DUALDECK_TEST_EXE = (Resolve-Path 'build-msvc/bin/DualDeckJuce.exe').Path
          python -m unittest discover -s Tests -p test_clean_install.py
      - name: Package preview with corresponding source
        run: python scripts/release.py bundle --binary build-msvc/bin/DualDeckJuce.exe --output dist/preview
      - uses: actions/upload-artifact@v4
        with:
          name: dualdeck-windows-preview
          path: dist/preview/*
          if-no-files-found: error
          retention-days: 14
